</defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,'Segoe UI',Arial,sans-serif}</style><rect x="0" y="0" width="620" height="340" rx="28" fill="#1d1d1f" /><text x="40" y="98" font-size="42" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1" >I build the systems</text><text x="40" y="150" font-size="42" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1" >behind payments,</text><text x="40" y="202" font-size="42" font-weight="700" letter-spacing="-1" fill="#f5f5f7"><tspan fill="url(#gs)">AI agents</tspan> and</text><text x="40" y="254" font-size="42" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1" >automated delivery.</text><text x="40" y="306" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >Now · Enterprise apps &amp; AI automation at Traecit</text><rect x="636" y="0" width="364" height="340" rx="28" fill="#f5f5f7" /><text x="668" y="196" font-size="150" font-weight="700" letter-spacing="-6" fill="url(#gs)">5+</text><text x="668" y="246" font-size="24" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.4" >years of shipping</text><text x="668" y="278" font-size="24" font-weight="600" fill="#86868b" text-anchor="start" letter-spacing="-0.4" >production software.</text><rect x="0.0" y="356" width="322.7" height="290" rx="28" fill="#f5f5f7" /><g transform="translate(32.0,392)" fill="none" stroke="#0071e3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4L40 13L22 22L4 13Z"/><path d="M4 22L22 31L40 22"/><path d="M4 31L22 40L40 31"/></g><text x="32.0" y="484" font-size="28" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.5" >Engineer</text><text x="32.0" y="516" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >Scalable, secure microservices</text><text x="32.0" y="540" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >and REST APIs, with solid auth,</text><text x="32.0" y="564" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >RBAC, caching and performance</text><text x="32.0" y="588" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >tuning.</text><rect x="338.7" y="356" width="322.7" height="290" rx="28" fill="#1d1d1f" /><g transform="translate(370.7,392)" fill="none" stroke="#bf5af2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3C24 15 29 20 41 22C29 24 24 29 22 41C20 29 15 24 3 22C15 20 20 15 22 3Z"/></g><text x="370.7" y="484" font-size="28" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5" >Automate</text><text x="370.7" y="516" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >LLM apps, AI agents and agentic</text><text x="370.7" y="540" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >workflows that take manual</text><text x="370.7" y="564" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >effort out of real business</text><text x="370.7" y="588" font-size="16" font-weight="400" fill="#86868b" text-anchor="start" letter-spacing="0" >processes.</text><rect x="677.3" y="356" width="322.7" height="290" rx="28" fill="url(#gc)" /><g transform="translate(709.3,392)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 35L35 9"/><path d="M15 9H35V29"/></g><text x="709.3" y="484" font-size="28" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="-0.5" >Ship</text><text x="709.3" y="516" font-size="16" font-weight="400" fill="#e5e5ff" text-anchor="start" letter-spacing="0" >Build, test and deploy</text><text x="709.3" y="540" font-size="16" font-weight="400" fill="#e5e5ff" text-anchor="start" letter-spacing="0" >automation with Jenkins and</text><text x="709.3" y="564" font-size="16" font-weight="400" fill="#e5e5ff" text-anchor="start" letter-spacing="0" >cloud delivery, so releases</text><text x="709.3" y="588" font-size="16" font-weight="400" fill="#e5e5ff" text-anchor="start" letter-spacing="0" >stay fast and safe.</text></svg>