<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Thanks for visiting"><defs>
<linearGradient id="gt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#2997ff"/><stop offset="0.4" stop-color="#bf5af2"/><stop offset="0.75" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2000 0" dur="24s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient>
<linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#5e5ce6"/></linearGradient>
<radialGradient id="r1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".5"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></radialGradient>
<radialGradient id="r2"><stop offset="0" stop-color="#bf5af2" stop-opacity=".45"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1000" height="300" rx="28"/></clipPath></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,'Segoe UI',Arial,sans-serif}.a{animation:a 12s ease-in-out infinite alternate}.b{animation:b 15s ease-in-out infinite alternate}@keyframes a{to{transform:translate(220px,-20px)}}@keyframes b{to{transform:translate(-240px,10px)}}</style><g clip-path="url(#c)"><rect width="1000" height="300" fill="#000"/>
<circle class="a" cx="220" cy="330" r="300" fill="url(#r1)"/><circle class="b" cx="800" cy="340" r="300" fill="url(#r2)"/>
<text x="500" y="124" font-size="64" font-weight="700" fill="url(#gt)" text-anchor="middle" letter-spacing="-2" >Thanks for visiting.</text>
<text x="500" y="176" font-size="20" font-weight="400" fill="#f5f5f7" text-anchor="middle" letter-spacing="0" fill-opacity=".78">Start where you are. Use what you have. Do what you can.</text>
<text x="500" y="262" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle" letter-spacing="0.4" >Prudhvi Kollana  ·  Full Stack Engineer</text></g></svg>