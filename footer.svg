<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f24"/>
      <stop offset="1" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="350" y1="0" x2="850" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-250 0" to="250 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.35"/></linearGradient>
    <linearGradient id="w2" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/><stop offset="1" stop-color="#f472b6" stop-opacity="0.30"/></linearGradient>
    <linearGradient id="w3" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.18"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="200" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Fira Code','SFMono-Regular',Consolas,monospace}
    .p{fill:#fff;animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.8;transform:translateY(-10px)}}
    .pulse{animation:pu 2.4s ease-in-out infinite}
    @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="200" fill="url(#bg)"/>

    <circle class="p" cx="140" cy="50" r="1.8" style="animation-delay:0s"/>
    <circle class="p" cx="330" cy="90" r="1.5" style="animation-delay:1s"/>
    <circle class="p" cx="520" cy="30" r="1.6" style="animation-delay:2s"/>
    <circle class="p" cx="860" cy="40" r="1.8" style="animation-delay:.6s"/>
    <circle class="p" cx="1010" cy="85" r="1.5" style="animation-delay:1.6s"/>
    <circle class="p" cx="1120" cy="35" r="1.6" style="animation-delay:2.6s"/>

    <!-- animated waves (period 600 => seamless loop) -->
    <path fill="url(#w3)" d="M0 120 Q150 90 300 120 T600 120 T900 120 T1200 120 T1500 120 T1800 120 T2100 120 T2400 120 V200 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="16s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w1)" d="M0 140 Q150 105 300 140 T600 140 T900 140 T1200 140 T1500 140 T1800 140 T2100 140 T2400 140 V200 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w2)" d="M0 160 Q150 130 300 160 T600 160 T900 160 T1200 160 T1500 160 T1800 160 T2100 160 T2400 160 V200 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="7s" repeatCount="indefinite"/>
    </path>

    <rect x="0" y="0" width="1200" height="3" fill="url(#line)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="68" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="6" fill="url(#t)" filter="url(#glow)">THANKS FOR VISITING</text>
    <circle class="pulse" cx="380" cy="98" r="3.5" fill="#22d3ee"/>
    <text class="mono" x="600" y="103" text-anchor="middle" font-size="13" letter-spacing="3" fill="#94a3b8">LET'S BUILD SOMETHING GREAT TOGETHER</text>
    <circle class="pulse" cx="820" cy="98" r="3.5" fill="#f472b6"/>
  </g>
  <rect x="1" y="1" width="1198" height="198" rx="18" fill="none" stroke="url(#line)" stroke-opacity="0.5"/>
</svg>
