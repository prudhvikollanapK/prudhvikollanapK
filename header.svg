<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Prudhvi Kollana - Full Stack Engineer, DevOps, AI Agents" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060d"/>
      <stop offset="0.5" stop-color="#0e1033"/>
      <stop offset="1" stop-color="#061320"/>
    </linearGradient>
    <radialGradient id="gc"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.50"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gv"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gp"><stop offset="0" stop-color="#f472b6" stop-opacity="0.40"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="900" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#67e8f9"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="300 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .o1{animation:d1 11s ease-in-out infinite alternate}
    .o2{animation:d2 13s ease-in-out infinite alternate}
    .o3{animation:d3 15s ease-in-out infinite alternate}
    @keyframes d1{from{transform:translate(0,0)}to{transform:translate(160px,40px)}}
    @keyframes d2{from{transform:translate(0,0)}to{transform:translate(-180px,-30px)}}
    @keyframes d3{from{transform:translate(0,0)}to{transform:translate(-90px,50px)}}
    .p{fill:#fff;animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.85;transform:translateY(-14px)}}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .sym{animation:fl 8s ease-in-out infinite alternate}
    @keyframes fl{from{transform:translateY(-8px)}to{transform:translateY(8px)}}
    .pulse{animation:pu 2.4s ease-in-out infinite}
    @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
    text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Fira Code','SFMono-Regular',Consolas,monospace}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridmask)"/>

    <!-- drifting aurora orbs -->
    <circle class="o1" cx="180" cy="90" r="230" fill="url(#gc)"/>
    <circle class="o2" cx="1020" cy="230" r="260" fill="url(#gv)"/>
    <circle class="o3" cx="640" cy="330" r="200" fill="url(#gp)"/>

    <!-- floating code glyphs -->
    <text class="sym" x="70" y="190" font-size="110" font-weight="700" fill="#22d3ee" fill-opacity="0.07">&lt;/&gt;</text>
    <text class="sym" x="990" y="170" font-size="110" font-weight="700" fill="#a78bfa" fill-opacity="0.08" style="animation-direction:alternate-reverse">{ }</text>

    <!-- particles -->
    <circle class="p" cx="120" cy="60"  r="2"   style="animation-delay:0s"/>
    <circle class="p" cx="260" cy="250" r="1.6" style="animation-delay:.8s"/>
    <circle class="p" cx="340" cy="90"  r="1.8" style="animation-delay:1.6s"/>
    <circle class="p" cx="470" cy="45"  r="1.4" style="animation-delay:2.4s"/>
    <circle class="p" cx="560" cy="280" r="2"   style="animation-delay:.4s"/>
    <circle class="p" cx="700" cy="60"  r="1.6" style="animation-delay:1.2s"/>
    <circle class="p" cx="810" cy="270" r="1.8" style="animation-delay:2s"/>
    <circle class="p" cx="900" cy="80"  r="2"   style="animation-delay:2.8s"/>
    <circle class="p" cx="1010" cy="40" r="1.4" style="animation-delay:.2s"/>
    <circle class="p" cx="1100" cy="150" r="1.8" style="animation-delay:1s"/>
    <circle class="p" cx="60"  cy="230" r="1.5" style="animation-delay:1.8s"/>
    <circle class="p" cx="1140" cy="280" r="2"  style="animation-delay:2.6s"/>

    <!-- top & bottom shimmer lines -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#line)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="317" width="1200" height="3" fill="url(#line)">
      <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g fill="none" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
      <path d="M32 62V32H62"/><path d="M1138 32H1168V62"/>
      <path d="M32 258V288H62"/><path d="M1138 288H1168V258"/>
    </g>

    <!-- status label -->
    <g class="rise" style="animation-delay:.1s">
      <circle class="pulse" cx="478" cy="76" r="4" fill="#22d3ee"/>
      <text class="mono" x="492" y="81" font-size="13" letter-spacing="4" fill="#94a3b8">PORTFOLIO  /  2026</text>
    </g>

    <!-- name -->
    <g class="rise" style="animation-delay:.3s">
      <text x="600" y="158" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="7" fill="url(#name)" filter="url(#glow)">PRUDHVI KOLLANA</text>
    </g>

    <!-- chips -->
    <g class="rise" style="animation-delay:.7s">
      <rect x="324" y="188" width="250" height="38" rx="19" fill="url(#chip)" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="449" y="212" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="3" fill="#e0f2fe">FULL STACK ENGINEER</text>
      <rect x="590" y="188" width="120" height="38" rx="19" fill="url(#chip)" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="650" y="212" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="3" fill="#ede9fe">DEVOPS</text>
      <rect x="726" y="188" width="150" height="38" rx="19" fill="url(#chip)" stroke="#f472b6" stroke-opacity="0.45"/>
      <text x="801" y="212" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="3" fill="#fce7f3">AI AGENTS</text>
    </g>

    <!-- sub line -->
    <g class="rise" style="animation-delay:1s">
      <text class="mono" x="600" y="266" text-anchor="middle" font-size="13" letter-spacing="3" fill="#94a3b8">5+ YEARS  ·  PAYMENTS  ·  LLM APPS  ·  CI/CD</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#line)" stroke-opacity="0.5"/>
</svg>
